<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipes.css">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>
    <header>
        <span>
            <img src="/images/recipe-book.png" alt="logo" id="logo">
            <h1>Recipebook</h1>
        </span>
        <form action="" placeholder="Find a recipe"></form>
        <img src="/images/search.svg" alt="search button" id="search-button">
    </header>

    <main>
        <div class="recipe-card">
            <img src="/images/apple-crisp.jpg" alt="Apple Crisp" id="apple-crisp">
            <div class="text">
                <p class="tag">dessert</p>
                <h2 class="name">APPLE CRISP</h2>
                <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
                >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="description">
                    This apple crisp is a simple yet delicious fall dessert that's great served warm
                    with a scoop of vanilla ice cream.
                </p>
            </div>
        </div>
    </main>

    <footer> 
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
            Recipe icons created by Freepik - Flaticon
        </a>                            
    </footer>
</body>
</html>
